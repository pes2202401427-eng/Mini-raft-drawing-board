version: '3.8'

services:
  replica1:
    build: ./replica
    container_name: replica1
    environment:
      - REPLICA_ID=replica1
      - PORT=5000
      - PEERS=replica2:5001,replica3:5002
      - GATEWAY_URL=http://gateway:8080   # ✅ ADD THIS
    ports:
      - "5000:5000"

  replica2:
    build: ./replica
    container_name: replica2
    environment:
      - REPLICA_ID=replica2
      - PORT=5001
      - PEERS=replica1:5000,replica3:5002
      - GATEWAY_URL=http://gateway:8080   # ✅ ADD THIS
    ports:
      - "5001:5001"

  replica3:
    build: ./replica
    container_name: replica3
    environment:
      - REPLICA_ID=replica3
      - PORT=5002
      - PEERS=replica1:5000,replica2:5001
      - GATEWAY_URL=http://gateway:8080   # ✅ ADD THIS
    ports:
      - "5002:5002"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - replica1
      - replica2
      - replica3